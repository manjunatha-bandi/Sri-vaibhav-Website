spring.application.name=SriVaibhav-Website-Backend

# Server Port (Auto-binds to Render $PORT in production, defaults to 8081 locally)
server.port=${PORT:8081}

# Database Configuration:
# Default: Embedded H2 database for instant demo / zero-setup deployment on Render
# To connect to a managed MySQL or PostgreSQL database in production, supply:
#   SPRING_DATASOURCE_URL=jdbc:mysql://<host>:<port>/<dbname>
#   SPRING_DATASOURCE_USERNAME=<user>
#   SPRING_DATASOURCE_PASSWORD=<password>
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/srivaibhav_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}

# JWT Configuration (Safe defaults; override with JWT_SECRET in production env)
app.jwtSecret=${JWT_SECRET:U3JpVmFpYmhhdlN1cGVyU2VjcmV0S2V5Rm9ySnduVEdlbmVyYXRpb25NYWtlSXRMb25nRW5vdWdoMTIzNDU2}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Administrator Configuration (No default hardcoded credentials; pass via env vars if needed)
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}

# File Storage Configuration (Local relative media folder; use Object Storage in production)
file.upload-dir=${FILE_UPLOAD_DIR:./media/}
