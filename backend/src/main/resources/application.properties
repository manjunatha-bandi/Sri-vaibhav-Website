spring.application.name=SriVaibhav-Website-Backend

# Server Port (Auto-binds to Render $PORT in production, defaults to 8081 locally)
server.port=${PORT:8081}

# Database Configuration (MySQL with H2 fallback so no external DB is mandatory)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/srivaibhav_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File Storage Configuration (Relative media folder in Docker/Linux)
file.upload-dir=${FILE_UPLOAD_DIR:./media/}

